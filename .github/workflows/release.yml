name: aapns release workflow

on:
  release:
    types: [released] # only triggered on release, not pre-release or draft release

permissions:
  contents: read
  id-token: write # crates.io trusted publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TARGET_BRANCH: ${{ github.event.release.target_commitish }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  TAG_NAME: ${{ github.ref_name }}

jobs:
  release:
    name: Release to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Check whether release target branch is default branch
        if: env.TARGET_BRANCH != env.DEFAULT_BRANCH
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed(`Target branch (${process.env.TARGET_BRANCH}) is not default branch (${process.env.DEFAULT_BRANCH}).`)

      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - run: echo "PKG_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_ENV"

      - name: Check whether current tag matches package version
        if: env.TAG_NAME != env.PKG_VER
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed(`Tag name (${process.env.TAG_NAME}) does not match package version (${process.env.PKG_VER}).`)

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish package to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
