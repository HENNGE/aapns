name: workflow

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra cli
      - run: uv run pytest --verbose

  mypy:
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra cli
      - run: uv run mypy

  isort:
    timeout-minutes: 10
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra cli
      - run: uv run isort --check --diff src tests

  black:
    timeout-minutes: 10
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra cli
      - run: uv run black --check src/ tests/

  ruff:
    timeout-minutes: 10
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra cli
      - run: uv run ruff src/ tests/
