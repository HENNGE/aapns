repos:
-   repo: local
    hooks:
    -   id: black
        name: black
        entry: uv run black
        language: system
        require_serial: true
        types: [python]
    -   id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
        require_serial: true
        args: ['--filter-files']
        files: "^(src/.*\\.py|tests/.*\\.py)"
    -   id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
    -   id: ruff
        name: ruff
        entry: uv run ruff --fix src tests
        language: system
        types: [python]
        pass_filenames: false
