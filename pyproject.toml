[project]
name = "aapns"
version = "23.7"
description = "Asynchronous Apple Push Notification Service Client"
authors = [
  {name = "Jonas Obrist", email = "jonas.obrist@hennge.com"},
  {name = "Dima Tisnek", email = "dimaqq@gmail.com"},
  {name = "Muhammad Furqan Habibi", email = "furqan.habibi@hennge.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["push-notification", "apple", "ios", "asyncio"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Topic :: Communications",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Framework :: AsyncIO",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: OS Independent",
]
requires-python = ">=3.8,<4"
dependencies = [
  "attrs>=23,<24",
  "h2>=3.2.0,<4",
]

[project.optional-dependencies]
cli = ["click>=8,<9"]

[project.scripts]
aapns = "aapns.cli:main"

[project.urls]
Homepage = "https://github.com/HENNGE/aapns"
Repository = "https://github.com/hennge/aapns"
Documentation = "https://aapns.readthedocs.io"

[dependency-groups]
dev = [
  "pytest>=7,<8",
  "cryptography>=41,<42",
  "pytest-asyncio>=0.21,<0.22",
  "sphinx>=7,<8",
  "mypy>=1.4,<2",
  "black>=23,<24",
  "isort>=5,<6",
  "ruff==0.0.275",
  "aiohttp>=3.8.4,<4",
]

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
files = [
    "src/",
    "tests/",
]

[tool.ruff]
ignore = [
    "E722", # Do not use bare `except`
    "E501", # Line too long (104 > 88 characters)
]
select = [
    "E", "F", "T201", # Don't commit print statements
]

[tool.ruff.per-file-ignores]
"tests/**" = ["T201"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = "tests"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
